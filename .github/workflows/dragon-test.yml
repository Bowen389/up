name: 龙纹单品供需验证

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dragon-test.yml'

permissions:
  contents: read

concurrency:
  group: yyyp-monitor
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YP_RAW_HEADERS: ${{ secrets.YP_RAW_HEADERS }}
      YP_AUTHORIZATION: ${{ secrets.YP_AUTHORIZATION }}
      YP_DEVICE_ID: ${{ secrets.YP_DEVICE_ID }}
      YP_DEVICE_UK: ${{ secrets.YP_DEVICE_UK }}
      YP_UK: ${{ secrets.YP_UK }}
      YYYP_DATA: ${{ github.workspace }}/smoke-output
      YYYP_FORCE: '1'
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 采集1件商品并核验数据库与报告
        run: |
          python -u - <<'PY'
          import json
          import os
          import pathlib
          import sqlite3
          import monitor

          original_load = monitor.load_items
          original_load()
          selected = [43712]
          if len(selected) != 1:
              raise RuntimeError("需要至少1件配置商品")
          monitor.load_items = lambda: selected
          original_post = monitor.post
          calls = 0
          def bounded_post(path, body, tries=2):
              global calls
              calls += 1
              if calls > 40:
                  raise RuntimeError("测试请求上限40次，停止采集")
              result = original_post(path, body, tries=min(tries, 2))
              code = result.get("code", result.get("Code"))
              if code != 0:
                  raise RuntimeError("接口返回非成功状态，code=" + str(code))
              return result
          monitor.post = bounded_post

          # 和全量任务共用并发锁；精准关键词只搜一页，按ID校验。
          def dragon_prices(items):
              result = monitor.post(
                  "/api/homepage/pc/goods/market/querySaleTemplate",
                  {"gameId": "730", "listType": "10", "keyWords": "黑龙纹身",
                   "pageIndex": 1, "pageSize": 20, "listSortType": 0, "sortType": 0})
              matches = [x for x in (result.get("Data") or [])
                         if str(x.get("id")) == "43712"]
              if len(matches) != 1:
                  raise RuntimeError("搜索未唯一匹配43712；停止，避免取错磨损或暗金版本")
              item = matches[0]
              price = float(item.get("price") or 0)
              if price <= 0:
                  raise RuntimeError("43712未返回有效在售价")
              print("精确匹配43712，一页搜索完成", flush=True)
              monitor.sleep()
              return {43712: (price, item.get("onSaleCount") or 0,
                              item["commodityName"])}
          monitor.batch_prices = dragon_prices
          monitor.main()

          data = pathlib.Path(os.environ["YYYP_DATA"])
          with sqlite3.connect(data / "yyyp.db") as db:
              db.row_factory = sqlite3.Row
              rows = [dict(r) for r in db.execute("SELECT * FROM snapshot ORDER BY tid")]
          if len(rows) != 1 or {r["tid"] for r in rows} != set(selected):
              raise RuntimeError("快照不完整，实际条数: " + str(len(rows)))
          report = data / "report.html"
          if not report.exists() or report.stat().st_size == 0:
              raise RuntimeError("报告未生成")
          summary = {
              "mode": "SMOKE_TEST_ONLY",
              "expected": 1,
              "collected": len(rows),
              "api_calls": calls,
              "snapshots": rows,
              "note": "独立测试数据；首次运行无历史对比，不代表完整市场扫描或交易信号"
          }
          (data / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## 求购小样本测试通过\n\n采集1/1件商品，数据库、JSON和HTML报告均已生成。\n")
              f.write("\n独立测试附件，不写入正式data目录。\n")
          print("SMOKE_TEST_OK collected=1 report=ready")
          PY
      - name: 上传独立测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yyyp-dragon-test-${{ github.run_id }}
          path: ${{ env.YYYP_DATA }}/
          if-no-files-found: warn
          retention-days: 7
