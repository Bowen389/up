name: 悠悠求购监控

on:
  workflow_dispatch:            # Actions 页面手动 Run workflow
    inputs:
      force:
        description: "强制完整重扫（忽略今天已扫过的数据）"
        type: boolean
        default: false
  schedule:
    - cron: "7 9 * * *"         # 每天北京时间 17:07（UTC 9:07）

permissions:
  contents: write

concurrency:
  group: yyyp-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      YP_RAW_HEADERS: ${{ secrets.YP_RAW_HEADERS }}       # 推荐：整段请求头
      YP_AUTHORIZATION: ${{ secrets.YP_AUTHORIZATION }}   # 或分别填 4 个（二选一）
      YP_DEVICE_ID: ${{ secrets.YP_DEVICE_ID }}
      YP_DEVICE_UK: ${{ secrets.YP_DEVICE_UK }}
      YP_UK: ${{ secrets.YP_UK }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查文件
        run: |
          echo "仓库根目录内容："; ls -la
          test -f monitor.py || { echo "❌ 根目录没有 monitor.py"; exit 1; }
          test -f items.txt  || { echo "❌ 根目录没有 items.txt"; exit 1; }
          grep -q "_load_cfg" monitor.py || { echo "❌ monitor.py 是旧版本，请替换为新版（需包含 _load_cfg）"; exit 1; }
          mkdir -p data
          echo "✅ 文件检查通过，监控商品数：$(grep -c '^[0-9]' items.txt)"

      - run: pip install requests

      - name: 接口预检
        run: |
          python - <<'PY'
          import sys, monitor
          monitor.check_token()
          d = monitor.post('/api/youpin/bff/trade/purchase/order/getTemplatePurchaseOrderListPC',
                           {'templateId': '43397', 'pageIndex': 1, 'pageSize': 10})
          ok1 = d.get('code') == 0
          d2 = monitor.post('/api/homepage/pc/goods/market/querySaleTemplate',
                            {'gameId': '730', 'listType': '10', 'keyWords': 'AWP', 'pageIndex': 1,
                             'pageSize': 10, 'listSortType': 0, 'sortType': 0})
          ok2 = d2.get('Code') == 0
          print('求购接口', '✅' if ok1 else f'❌ {d}')
          print('搜索接口', '✅' if ok2 else f'❌ {d2}')
          if not (ok1 and ok2):
              sys.exit('接口不可用（可能是海外 IP 被拦截或 token 失效）')
          PY

      - name: 运行监控
        env:
          YYYP_FORCE: ${{ inputs.force }}
        run: python -u monitor.py

      - name: 保存原始采集结果，防止推送失败后丢失
        if: always()
        run: |
          mkdir -p publish-backup
          test ! -f data/yyyp.db || cp data/yyyp.db publish-backup/yyyp.db
          test ! -f data/report.html || cp data/report.html publish-backup/report.html

      - name: 提交数据和报告（同步远端并重试）
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for path in data/yyyp.db data/report.html; do
            if [ -f "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No new daily demand data to publish"
            exit 0
          fi
          git commit -m "data: $(date +'%F %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected or unavailable; retry $attempt/3"
            sleep 5
          done
          echo "::error::Daily demand data was collected but NOT published; raw database is preserved in artifact."
          exit 1

      - name: 上传原始数据库和报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            publish-backup/yyyp.db
            publish-backup/report.html
          if-no-files-found: ignore
          retention-days: 30
